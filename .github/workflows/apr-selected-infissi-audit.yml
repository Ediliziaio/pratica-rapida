name: APR selected infissi read-only audit

on:
  push:
    branches:
      - agent/crm-ombra-enea-lab
    paths:
      - ".github/workflows/apr-selected-infissi-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      APR_CLIENT_HASH: 3432bb788c0f56cfe2cbbeed9332defa
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run selected practice audit
        run: bun scripts/apr-selected-infissi-audit.mjs
      - name: Upload redacted audit
        uses: actions/upload-artifact@v4
        with:
          name: apr-selected-infissi-audit
          path: apr-selected-infissi-audit.json
          if-no-files-found: error
          retention-days: 1
