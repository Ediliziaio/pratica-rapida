name: ENEA Lab CI

on:
  push:
    branches:
      - agent/crm-ombra-enea-lab
    paths:
      - "src/features/enea-lab/**"
      - "src/pages/EneaLab.tsx"
      - "src/pages/EneaLab.test.tsx"
      - "src/App.tsx"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/enea-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-enea-lab:
    name: Verify ENEA Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crm-ombra-enea-lab
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply one-shot gTot readiness remediation
        run: echo '' | base64 -d | python3
      - name: Diff sanity
        run: git diff --check
      - name: Install dependencies
        run: bun install
      - name: ENEA Lab tests
        run: bunx vitest run src/features/enea-lab src/pages/EneaLab.test.tsx
      - name: Typecheck
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Commit verified remediation and restore CI workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/enea-lab-ci.yml
          git add .github/workflows/enea-lab-ci.yml src/features/enea-lab/mapper.ts src/features/enea-lab/preparation.ts src/features/enea-lab/mapper.test.ts src/features/enea-lab/gtotSafety.test.ts
          git diff --cached --check
          git commit -m "Allinea readiness gTot non documentato"
          git push origin HEAD:agent/crm-ombra-enea-lab
