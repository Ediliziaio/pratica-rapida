name: Deploy ENEA intake diagnostics only

on:
  push:
    branches:
      - codex/intake-potito-murru-diagnostics

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc -p tsconfig.app.json --noEmit
      - run: bunx vitest run src/lib/eneaIntakeDiagnostic.test.ts src/features/cfCustomerEvidence.test.ts

  deploy-function:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Deploy only the intake diagnostic function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy enea-intake-diagnostic --project-ref "${SUPABASE_PROJECT_REF:-xmkjrhwmmuzaqjqlvzxm}" --no-verify-jwt

  deploy-frontend:
    needs: deploy-function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build current frontend
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - run: npm install -g wrangler
      - name: Deploy only the CRM/site frontend
        run: wrangler pages deploy dist --project-name=pratica-rapida --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b3423ec9073bbd86dcc206273d7e093c
